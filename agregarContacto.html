<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/styles.css">
</head>

<body>

    <!-- Barra de navegación idéntica -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">Alke Wallet</a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="menuPrincipal.html" class="nav-button">Panel</a></li>
                <li class="nav-item"><a href="realizarTransferencias.html" class="nav-button">Transferir</a></li>
                <li class="nav-item"><a href="depositar.html" class="nav-button">Depositar</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contenedor adaptado (estilo formulario compacto) -->
    <main class="main-container" style="max-width: 600px;">
        <h2 class="page-title">Agregar Nuevo Contacto</h2>

        <div class="card-section">
            <form id="add-contact-form">
                <!-- Campo: Nombre -->
                <div class="form-group">
                    <label for="contact-name">Nombre Completo</label>
                    <input type="text" id="contact-name" placeholder="Ej: María José Poblete" required>
                </div>

                <!-- Campo: RUT -->
                <div class="form-group">
                    <label for="contact-rut">RUT</label>
                    <input type="text" id="contact-rut" placeholder="Ej: 12.345.678-9" required>
                </div>

                <!-- Campo: Banco -->
                <div class="form-group">
                    <label for="contact-bank">Banco</label>
                    <input type="text" id="contact-bank" placeholder="Ej: Banco Estado, Bci, Santander" required>
                </div>

                <!-- Campo: Tipo de Cuenta (Menú Desplegable) -->
                <div class="form-group">
                    <label for="contact-account-type">Tipo de Cuenta</label>
                    <select id="contact-account-type" required>
                        <option value="" disabled selected>Selecciona un tipo...</option>
                        <option value="Cuenta Vista/Rut">Cuenta Vista/Rut</option>
                        <option value="Cuenta Corriente">Cuenta Corriente</option>
                        <option value="Cuenta de Ahorro">Cuenta de Ahorro</option>
                    </select>
                </div>

                <!-- Campo: Número de Cuenta -->
                <div class="form-group">
                    <label for="contact-account-number">Número de Cuenta</label>
                    <input type="number" id="contact-account-number" placeholder="Ej: 1234567890" required>
                </div>

                <!-- Campo: Email -->
                <div class="form-group">
                    <label for="contact-email">Correo Electrónico</label>
                    <input type="email" id="contact-email" placeholder="ejemplo@correo.com" required>
                </div>

                <!-- Botones de Acción -->
                <button type="submit" class="btn-submit" style="margin-top: 10px;">Guardar Contacto</button>
                <a href="contactos.html" class="btn-secondary"
                    style="display: block; text-align: center; text-decoration: none; margin-top: 15px; box-sizing: border-box;">Cancelar</a>
            </form>
        </div>
    </main>

    <!-- Notificación emergente -->
    <div id="toast" class="toast">¡Contacto guardado con éxito!</div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/styles/JS/scripts.js"></script>
</body>

</html>
