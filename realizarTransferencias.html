<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/styles.css">
</head>

<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">Alke Wallet</a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="menuPrincipal.html" class="nav-button">Panel</a></li>
                <li class="nav-item"><a href="#" class="nav-button active">Transferir</a></li>
                <li class="nav-item"><a href="depositar.html" class="nav-button">Depositar</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-container">

        <h1 class="page-title">Realizar Transferencia</h1>

        <div class="transfer-grid">

            <div class="card-section">
                <h2 class="card-subtitle">Enviar Dinero</h2>

                <form action="/send-transfer" method="POST">
                    <div class="form-group">
                        <label for="select-contact">Seleccionar Contacto Destinatario</label>
                        <select id="select-contact" name="recipient_id" required>
                            <option value="" disabled selected>Elige un contacto de tu lista</option>
                            <option value="1">Juan Pérez (CBU: 00000031000...)</option>
                            <option value="2">María Rodriguez (CBU: 00000031001...)</option>
                            <option value="3">Carlos Gómez (CBU: 00000031002...)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="amount">Monto a Transferir ($)</label>
                        <input type="number" id="amount" name="amount" min="1" step="0.01" placeholder="0,00" required>
                    </div>

                    <div class="form-group">
                        <label for="concept">Concepto / Referencia</label>
                        <input type="text" id="concept" name="concept" placeholder="Ej: Alquiler, Varios..." required>
                    </div>

                    <button type="submit" class="btn-submit">Confirmar Transferencia</button>
                </form>
            </div>

            <div class="card-section">
                <h2 class="card-subtitle">Contactos Frecuentes</h2>

                <div class="contacts-list">
                    <div class="contact-item">
                        <div class="contact-info">
                            <div class="contact-name">Juan Pérez</div>
                            <div class="contact-detail">CBU/CVU: 0000003100098765432101</div>
                        </div>
                        <button class="btn-select-contact"
                            onclick="document.getElementById('select-contact').value='1'">Transferir</button>
                    </div>

                    <div class="contact-item">
                        <div class="contact-info">
                            <div class="contact-name">María Rodriguez</div>
                            <div class="contact-detail">Alias: maria.wallet.fintech</div>
                        </div>
                        <button class="btn-select-contact"
                            onclick="document.getElementById('select-contact').value='2'">Transferir</button>
                    </div>

                    <div class="contact-item">
                        <div class="contact-info">
                            <div class="contact-name">Carlos Gómez</div>
                            <div class="contact-detail">CBU/CVU: 0000003100211223344556</div>
                        </div>
                        <button class="btn-select-contact"
                            onclick="document.getElementById('select-contact').value='3'">Transferir</button>
                    </div>
                </div>

                <a href="agregarContacto.html" class="btn-secondary"
                    style="display: block; text-align: center; text-decoration: none; box-sizing: border-box;">+ Agregar
                    Contacto</a>
            </div>

        </div>

    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/styles/JS/scripts.js"></script>
</body>

</html>
