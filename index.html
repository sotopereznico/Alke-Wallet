<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/styles.css">
</head>

<body>

    <div class="login-container">
        <div class="login-header">
            <h1>Alke Wallet</h1>
            <p>Gestiona tu dinero de forma segura</p>
        </div>

        <form action="/login-endpoint" method="POST">

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="username" placeholder="billetera@alke.cl" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="contraseña (987654)" required>
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>

        <div class="divider">
            <span>¿No tienes una cuenta?</span>
        </div>

        <button class="btn-register" onclick="window.location.href='#'">Crear Cuenta Nueva</button>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/styles/JS/scripts.js"></script>
</body>

</html>
